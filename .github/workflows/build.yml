name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps (X11)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-xfixes0-dev
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: clipguard-${{ runner.os }}
          path: |
            target/release/clipguard
            target/release/clipguard.exe
          if-no-files-found: ignore
